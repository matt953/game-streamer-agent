[package]
name = "gsa-audio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
license = "MIT OR Apache-2.0"
description = "Opus audio codec (encode/decode) for game-streamer-agent"

[dependencies]
gsa-core = { workspace = true }
opusic-c = "1.6"
bytemuck = "1"
tracing = { workspace = true }

# Not the workspace set: one `unsafe impl Send` is needed for the libopus
# multistream decoder, whose binding omits the declaration its stereo
# sibling has. Everything else the workspace denies stays denied.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
