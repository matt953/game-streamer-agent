[package]
name = "gsa-client-dev"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
license = "MIT OR Apache-2.0"
description = "Developer debug client for game-streamer-agent: headless stats mode and windowed presentation"

[[bin]]
name = "gsa-client-dev"
path = "src/main.rs"

[dependencies]
gsa-core = { workspace = true }
gsa-protocol = { workspace = true }
gsa-client-core = { workspace = true }
gsa-backend-moonlight = { workspace = true }
gsa-decode-videotoolbox = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
openh264 = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
cpal = "0.15"
gilrs = "0.11"
font8x8 = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { workspace = true, features = ["CFNumber", "CFDictionary", "CFString"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGDirectDisplay", "CGDisplayConfiguration"] }
objc2-app-kit = { version = "0.3.2", features = ["NSScreen", "NSResponder", "NSApplication"] }
objc2-core-media = { workspace = true, features = ["CMSampleBuffer", "CMTime", "CMFormatDescription", "CMBlockBuffer"] }
objc2-core-video = { workspace = true, features = ["CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn", "CVMetalTexture", "CVMetalTextureCache", "objc2-metal"] }
objc2-metal = { workspace = true }
objc2-video-toolbox = { workspace = true, features = ["VTDecompressionSession", "VTDecompressionProperties", "VTSession", "VTErrors", "objc2-core-media", "block2"] }
block2 = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true, features = ["NSArray", "NSNotification", "NSString", "NSEnumerator"] }
objc2-core-haptics = { workspace = true, features = [
    "CHHapticEngine",
    "CHHapticPattern",
    "CHHapticEvent",
    "CHHapticParameter",
    "CHHapticPatternPlayer",
] }
objc2-game-controller = { workspace = true, features = [
    "GCDeviceHaptics",
    "GCController",
    "GCExtendedGamepad",
    "GCControllerElement",
    "GCControllerButtonInput",
    "GCControllerAxisInput",
    "GCControllerDirectionPad",
    "GCMotion",
    "GCPhysicalInputProfile",
    "GCDevice",
    "GCDeviceBattery",
    "GCDualSenseGamepad",
    "GCDualShockGamepad",
    "GCControllerTouchpad",
] }

# Hosts the VideoToolbox decoder FFI (decoder_vt.rs): opts out of the
# workspace-wide `unsafe_code = "forbid"`; unsafe blocks must carry SAFETY
# comments (undocumented_unsafe_blocks = deny).
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
