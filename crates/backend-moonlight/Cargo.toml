[package]
name = "gsa-backend-moonlight"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
license = "MIT OR Apache-2.0"
description = "Moonlight-protocol client backend (Sunshine/Apollo/Wolf hosts) — clean-room"

[dependencies]
gsa-core = { workspace = true }
gsa-client-backend-api = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rcgen = { workspace = true }
roxmltree = "0.21"
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
aes = "0.8"
aes-gcm = "0.10"
rusty_enet = "0.4"
fec-rs = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }
x509-parser = "0.18"
rustls = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pemfile = "2"

[dev-dependencies]
gsa-client-core = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
