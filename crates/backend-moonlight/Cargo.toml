[package]
name = "gsa-backend-moonlight"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
license = "MIT OR Apache-2.0"
description = "Moonlight-protocol client backend (Sunshine/Apollo/Wolf hosts) — clean-room"

[features]
default = ["native"]
# Sockets, threads, TLS and libopus: everything a native client has and a
# browser does not. Off, the crate is the protocol alone — RTSP, control
# session, depacketising, FEC, input encoding — for the wasm32 build.
native = [
    "dep:gsa-audio",
    "dep:rusty_enet",
    "dep:rustls",
    "dep:tokio-rustls",
    "dep:rustls-pemfile",
    "dep:rcgen",
    "dep:x509-parser",
    "dep:rsa",
    "dep:sha2",
    "tokio/rt-multi-thread",
    "tokio/net",
    "tokio/time",
    "tokio/io-util",
]

[dependencies]
gsa-core = { workspace = true }
gsa-client-backend-api = { workspace = true }
gsa-protocol = { workspace = true }
gsa-tunnel = { workspace = true }
gsa-audio = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "macros"] }
tracing = { workspace = true }
rcgen = { workspace = true, optional = true }
roxmltree = "0.21"
rsa = { version = "0.9", optional = true }
sha2 = { version = "0.10", features = ["oid"], optional = true }
aes = "0.8"
aes-gcm = "0.10"
rusty_enet = { version = "0.4", optional = true }
fec-rs = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }
x509-parser = { version = "0.18", optional = true }
rustls = { workspace = true, optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
rustls-pemfile = { version = "2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
gsa-client-core = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
