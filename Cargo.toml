[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/capture-api",
    "crates/encode-api",
    "crates/audio",
    "crates/protocol",
    "crates/transport",
    "crates/sources",
    "crates/encode-sw",
    "crates/session",
    "crates/tunnel",
    "crates/backend-moonlight",
    "crates/client-backend-api",
    "crates/client-core",
    "crates/client-ffi",
    "crates/client-web",
    "crates/client-dev",
    "crates/capture-macos",
    "crates/capture-windows",
    "crates/encode-nvenc",
    "crates/encode-videotoolbox",
    "crates/decode-videotoolbox",
    "crates/input",
    "crates/agent",
    "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/matt953/game-streamer-agent"

[workspace.dependencies]
# intra-workspace
gsa-core = { path = "crates/core" }
gsa-capture-api = { path = "crates/capture-api" }
gsa-encode-api = { path = "crates/encode-api" }
gsa-audio = { path = "crates/audio" }
gsa-protocol = { path = "crates/protocol" }
gsa-transport = { path = "crates/transport" }
gsa-sources = { path = "crates/sources" }
gsa-encode-sw = { path = "crates/encode-sw" }
gsa-session = { path = "crates/session" }
gsa-tunnel = { path = "crates/tunnel" }
gsa-backend-moonlight = { path = "crates/backend-moonlight" }
gsa-client-backend-api = { path = "crates/client-backend-api" }
gsa-client-core = { path = "crates/client-core" }
gsa-client-ffi = { path = "crates/client-ffi" }
gsa-client-web = { path = "crates/client-web" }
gsa-capture-macos = { path = "crates/capture-macos" }
gsa-capture-windows = { path = "crates/capture-windows" }
gsa-encode-nvenc = { path = "crates/encode-nvenc" }
gsa-encode-videotoolbox = { path = "crates/encode-videotoolbox" }
gsa-decode-videotoolbox = { path = "crates/decode-videotoolbox" }
gsa-input = { path = "crates/input" }

# external
# Minimal on purpose: the browser build of the shared crates cannot take
# tokio's net/time features. Native crates add what they use.
tokio = { version = "1", default-features = false, features = ["sync"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
thiserror = "2"
bytes = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
toml = "1"
openh264 = "0.9"
winit = "0.30"
wgpu = "30"
pollster = "0.4"
anyhow = "1"
# Portable time and task primitives: the same code on native and wasm32.
web-time = "1"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
# The browser client's bindings.
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
wasm-bindgen-test = "0.3"

# Apple FFI (macOS backends only)
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-metal = "0.3"
objc2-core-graphics = "0.3"
objc2-video-toolbox = "0.3"
objc2-io-surface = "0.3"
objc2-game-controller = "0.3"
objc2-core-haptics = "0.3"
dispatch2 = "0.3"
block2 = "0.6"

# Win32/WinRT FFI (Windows backends only)
windows = "0.62"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

# The software codec is real-time even in dev builds only when its C core
# is optimized; everything else stays fast-compiling debug.
[profile.dev.package.openh264]
opt-level = 3
[profile.dev.package.openh264-sys2]
opt-level = 3
